<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ebru: Suyun İzi</title>
<style>
:root{--water:#d5dcda;--ink:#14213d;--panel:rgba(250,251,250,.84);--line:rgba(20,33,61,.2);box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--water:#1c2530;--ink:#e8edf2;--panel:rgba(18,24,32,.82);--line:rgba(232,237,242,.22)}}
:root[data-theme="dark"]{--water:#1c2530;--ink:#e8edf2;--panel:rgba(18,24,32,.82);--line:rgba(232,237,242,.22)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--water);color:var(--ink);font-family:"Iowan Old Style",Georgia,serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
header{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 0;pointer-events:none}
h1{margin:0;font-size:1.35rem;font-weight:600;font-style:italic;letter-spacing:.01em}
#hint{margin:4px 0 0;max-width:30ch;font-size:.9rem;line-height:1.4;transition:opacity .8s}
#hint.off{opacity:0}
nav{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);max-width:560px;margin:0 auto}
button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:14px;padding:8px 14px;touch-action:manipulation;cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button[aria-pressed="true"]{background:var(--ink);color:var(--water)}
.seg,#sw{display:flex;gap:6px}
#sw button{width:32px;height:32px;padding:0;border-radius:50%}
#sw button[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
.err{position:fixed;inset:30% 20px auto;text-align:center}
</style>
</head>
<body>
<canvas id="c"></canvas>
<header><h1>Ebru</h1><p id="hint">Bir renk seç, suya dokun: damla düşer. Sonra Biz ile çiz, Tarak ile çek.</p></header>
<nav>
  <div class="seg" role="group" aria-label="Araç">
    <button data-tool="damla" aria-pressed="true">Damla</button>
    <button data-tool="biz" aria-pressed="false">Biz</button>
    <button data-tool="tarak" aria-pressed="false">Tarak</button>
  </div>
  <div id="sw" role="group" aria-label="Renk"></div>
  <button id="clr">Temizle</button>
</nav>
<script>
(function(){
const cv=document.getElementById('c');
const gl=cv.getContext('webgl2',{alpha:false,antialias:false,powerPreference:'high-performance'});
if(!gl||!(gl.getExtension('EXT_color_buffer_float')||gl.getExtension('EXT_color_buffer_half_float'))){
  document.body.insertAdjacentHTML('beforeend','<p class="err">Bu tarayıcı WebGL2 ile kayan noktalı doku desteklemiyor. Güncel Chrome veya Safari dene.</p>');return;
}
const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
const COLORS=[['Lacivert','#17306b'],['Kırmızı','#b3262e'],['Hardal','#d4a017'],['Yeşil','#1f7a5c'],['Turkuaz','#1fa3b0'],['Siyah','#1a1a1e']];
const VEL_RES=mobile?96:128, DYE_RES=mobile?384:512, ITER=mobile?16:22;
let tool='damla',color=COLORS[0][1];

// ---- GL helpers
const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(o));return o};
const VS=sh(gl.VERTEX_SHADER,'#version 300 es\nout vec2 uv;void main(){vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));uv=p;gl_Position=vec4(p*2.-1.,0,1);}');
const H='#version 300 es\nprecision highp float;precision highp sampler2D;in vec2 uv;out vec4 o;uniform vec2 t;\n';
const P=f=>{const p=gl.createProgram();gl.attachShader(p,VS);gl.attachShader(p,sh(gl.FRAGMENT_SHADER,H+f));gl.linkProgram(p);const u={},n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);for(let i=0;i<n;i++){const k=gl.getActiveUniform(p,i).name;u[k]=gl.getUniformLocation(p,k)}return{p,u}};
const run=(pr,a,tg)=>{gl.useProgram(pr.p);let un=0;
  for(const k in a){const v=a[k],l=pr.u[k];
    if(v&&v.t){gl.activeTexture(gl.TEXTURE0+un);gl.bindTexture(gl.TEXTURE_2D,v.t);gl.uniform1i(l,un++)}
    else if(typeof v=='number')gl.uniform1f(l,v);else if(v.length==2)gl.uniform2fv(l,v);else gl.uniform3fv(l,v)}
  if(tg){gl.bindFramebuffer(gl.FRAMEBUFFER,tg.f);gl.viewport(0,0,tg.w,tg.h)}else{gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,gl.drawingBufferWidth,gl.drawingBufferHeight)}
  gl.drawArrays(gl.TRIANGLES,0,3)};
const mk=(w,h)=>{const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,w,h,0,gl.RGBA,gl.HALF_FLOAT,null);
  [[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]].forEach(([a,b])=>gl.texParameteri(gl.TEXTURE_2D,a,b));
  const f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);return{t,f,w,h}};
const dbl=(w,h)=>{const d={a:mk(w,h),b:mk(w,h),swap(){const x=d.a;d.a=d.b;d.b=x}};return d};

// ---- Programs
const splat=P('uniform sampler2D s;uniform vec2 p;uniform vec3 c;uniform float r,ar,m;void main(){vec2 d=uv-p;d.x*=ar;vec4 b=texture(s,uv);float k=m>.5?1.-smoothstep(.8,1.,length(d)/r):exp(-dot(d,d)/r);o=m>.5?vec4(mix(b.rgb,c,k),1):vec4(b.rgb+c*k,1);}');
const adv=P('uniform sampler2D v,s;uniform float dt,df;void main(){vec2 c=uv-dt*texture(v,uv).xy*t;o=texture(s,c)/(1.+df*dt);}');
const dvg=P('uniform sampler2D v;void main(){vec2 c=texture(v,uv).xy;float L=texture(v,uv-vec2(t.x,0)).x,R=texture(v,uv+vec2(t.x,0)).x,T=texture(v,uv+vec2(0,t.y)).y,B=texture(v,uv-vec2(0,t.y)).y;if(uv.x-t.x<0.)L=-c.x;if(uv.x+t.x>1.)R=-c.x;if(uv.y+t.y>1.)T=-c.y;if(uv.y-t.y<0.)B=-c.y;o=vec4(.5*(R-L+T-B),0,0,1);}');
const prs=P('uniform sampler2D p,d;void main(){float L=texture(p,uv-vec2(t.x,0)).x,R=texture(p,uv+vec2(t.x,0)).x,T=texture(p,uv+vec2(0,t.y)).x,B=texture(p,uv-vec2(0,t.y)).x;o=vec4((L+R+B+T-texture(d,uv).x)*.25,0,0,1);}');
const grd=P('uniform sampler2D p,v;void main(){float L=texture(p,uv-vec2(t.x,0)).x,R=texture(p,uv+vec2(t.x,0)).x,T=texture(p,uv+vec2(0,t.y)).x,B=texture(p,uv-vec2(0,t.y)).x;o=vec4(texture(v,uv).xy-vec2(R-L,T-B),0,1);}');
const scl=P('uniform sampler2D s;uniform float k;void main(){o=texture(s,uv)*k;}');
const dsp=P('uniform sampler2D s;float L(vec2 q){return dot(texture(s,q).rgb,vec3(.3,.59,.11));}void main(){vec3 c=texture(s,uv).rgb;float lx=L(uv+vec2(t.x,0))-L(uv-vec2(t.x,0)),ly=L(uv+vec2(0,t.y))-L(uv-vec2(0,t.y));c+=(lx-ly)*.3;c+=(fract(sin(dot(gl_FragCoord.xy,vec2(12.9898,78.233)))*43758.5453)-.5)*.02;o=vec4(c,1);}');

// ---- Simulation state
let vel,dye,pres,divT,vt,dt_,water=[.8,.85,.85],ar=1;
const res=b=>ar>1?[Math.round(b*ar),b]:[b,Math.round(b/ar)];
const cssWater=()=>{const h=getComputedStyle(document.documentElement).getPropertyValue('--water').trim();const n=parseInt(h.slice(1),16);return[(n>>16)/255,((n>>8)&255)/255,(n&255)/255]};
const hex=h=>{const n=parseInt(h.slice(1),16);return[(n>>16)/255,((n>>8)&255)/255,(n&255)/255]};
function fit(){const d=Math.min(window.devicePixelRatio||1,mobile?1.5:2);cv.width=Math.round(innerWidth*d);cv.height=Math.round(innerHeight*d)}
function init(){
  fit();ar=cv.width/cv.height;water=cssWater();
  const[vw,vh]=res(VEL_RES),[dw,dh]=res(DYE_RES);
  vel=dbl(vw,vh);pres=dbl(vw,vh);divT=mk(vw,vh);dye=dbl(dw,dh);
  vt=[1/vw,1/vh];dt_=[1/dw,1/dh];clearAll();
}
function clearAll(){
  for(const f of[vel.a,vel.b,pres.a,pres.b,divT]){gl.bindFramebuffer(gl.FRAMEBUFFER,f.f);gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT)}
  for(const f of[dye.a,dye.b]){gl.bindFramebuffer(gl.FRAMEBUFFER,f.f);gl.clearColor(water[0],water[1],water[2],1);gl.clear(gl.COLOR_BUFFER_BIT)}
}
function addVel(x,y,fx,fy,r){run(splat,{s:vel.a,p:[x,y],c:[fx,fy,0],r,ar,m:0},vel.b);vel.swap()}
function addDye(x,y,col,r){run(splat,{s:dye.a,p:[x,y],c:col,r,ar,m:1},dye.b);dye.swap()}
const dropR=()=>.055*Math.min(1,ar);
function drop(x,y){addDye(x,y,hex(color),dropR()*(.85+Math.random()*.3))}

function step(dt){
  dt=Math.min(dt,.033);
  run(adv,{v:vel.a,s:vel.a,t:vt,dt,df:2.5},vel.b);vel.swap();
  run(dvg,{v:vel.a,t:vt},divT);
  run(scl,{s:pres.a,k:.8},pres.b);pres.swap();
  for(let i=0;i<ITER;i++){run(prs,{p:pres.a,d:divT,t:vt},pres.b);pres.swap()}
  run(grd,{p:pres.a,v:vel.a,t:vt},vel.b);vel.swap();
  run(adv,{v:vel.a,s:dye.a,t:vt,dt,df:0},dye.b);dye.swap();
  run(dsp,{s:dye.a,t:dt_});
}

// ---- Tools (Faz 1: Biz = ince hat, Tarak = çok dişli geniş hat)
const F=5000;
function drag(x0,y0,x1,y1){
  const dx=x1-x0,dy=y1-y0,dist=Math.hypot(dx*ar,dy);if(dist<1e-4)return;
  const n=Math.min(14,Math.ceil(dist/.01)),fx=dx/n*F,fy=dy/n*F;
  const nx=-dy,ny=dx*ar,nl=Math.hypot(nx,ny)||1,px=nx/nl/ar,py=ny/nl;
  for(let i=1;i<=n;i++){
    const x=x0+dx*i/n,y=y0+dy*i/n;
    if(tool==='biz')addVel(x,y,fx,fy,.00015);
    else for(let k=-4;k<=4;k++)addVel(x+px*k*.028,y+py*k*.028,fx,fy,.00007);
  }
}

// ---- Input
const ptr=new Map(),hint=document.getElementById('hint');
const pos=e=>[e.clientX/innerWidth,1-e.clientY/innerHeight];
const used=()=>hint.classList.add('off');
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);const p=pos(e);ptr.set(e.pointerId,p);used();if(tool==='damla')drop(p[0],p[1])});
cv.addEventListener('pointermove',e=>{const l=ptr.get(e.pointerId);if(!l)return;const p=pos(e);if(tool!=='damla')drag(l[0],l[1],p[0],p[1]);ptr.set(e.pointerId,p)});
for(const t of['pointerup','pointercancel'])cv.addEventListener(t,e=>ptr.delete(e.pointerId));

// ---- UI
const sw=document.getElementById('sw');
COLORS.forEach(([name,h],i)=>{const b=document.createElement('button');b.style.background=h;b.setAttribute('aria-label',name);b.setAttribute('aria-pressed',i===0);b.onclick=()=>{color=h;tool='damla';sync();for(const x of sw.children)x.setAttribute('aria-pressed',x===b)};sw.appendChild(b)});
function sync(){document.querySelectorAll('[data-tool]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tool===tool))}
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;sync()});
document.getElementById('clr').onclick=()=>{water=cssWater();clearAll()};
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{const a=innerWidth/innerHeight;if(Math.abs(a/ar-1)>.15)init();else fit()},200)});

// ---- Start: üç tohumluk damla, sonra döngü
init();
[[.3,.62,2],[.62,.5,1],[.45,.3,3]].forEach(([x,y,i])=>addDye(x,y,hex(COLORS[i][1]),dropR()*1.5));
let last=performance.now(),fr=0,acc=0;const dbg=location.hash==='#fps';
(function loop(now){
  const dt=(now-last)/1000;last=now;step(dt);
  if(dbg){fr++;acc+=dt;if(acc>=1){console.log('FPS',fr);fr=0;acc=0}}
  requestAnimationFrame(loop);
})(last);
})();
</script>
</body>
</html>
